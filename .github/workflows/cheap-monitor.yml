name: 每日便宜价检测

on:
  schedule:
    # 北京时间 06:00 与 22:00（对应 UTC 22:00 与 14:00），覆盖美股收盘后
    - cron: "0 14,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 运行检测并生成网页
        run: python gen_cheap_monitor.py

      - name: 提交并更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cheap-monitor.html cheap-data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 每日便宜价自动检测 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push origin main
